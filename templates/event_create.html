{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/event_create.css' %}">
    <title>Создание события - Journal</title>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Journal</div>
            <nav class="nav-menu">
                <a href="{% url 'main_view' %}">Главная</a>
                <a href="{% url 'schedule_create_view' %}">Расписание</a>
                <a href="{% url 'group_list_view' %}">Группы</a>
                <a href="{% url 'subject_list_view' %}">Предметы</a>
                <a href="{% url 'payment_info_view' %}">Оплаты</a>
                <a href="{% url 'debtor_list_view' %}">Должники</a>
                <a href="{% url 'announcements_view' %}">Объявления</a>
                <a href="{% url 'events_view' %}">События</a>
                <a href="{% url 'chat_list_view' %}">Чаты</a>
            </nav>
            <div class="user-info">
                <span class="user-name">{{ user.user }}</span>
                <a href="{% url 'profile_edit_view' %}" class="btn-profile">Профиль</a>
                <a href="{% url 'logout_view' %}" class="btn-logout">Выйти</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="create-event-container">
            <div class="page-header">
                <a href="{% url 'events_view' %}" class="back-link">← Назад к событиям</a>
                <h1 class="page-title">➕ Создание события</h1>
            </div>

            <div class="create-card">
                <form method="post" id="eventForm">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_title">🎯 Название события</label>
                        <input type="text" name="title" id="id_title" class="form-control" placeholder="Введите название" required>
                    </div>

                    <div class="form-group">
                        <label for="id_event_type">📌 Тип события</label>
                        <select name="event_type" id="id_event_type" class="form-control" required>
                            <option value="">Выберите тип</option>
                            <option value="holiday">🎉 Праздник</option>
                            <option value="exam">📝 Экзамен</option>
                            <option value="meeting">👥 Собрание</option>
                            <option value="deadline">⏰ Дедлайн</option>
                            <option value="other">📌 Другое</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="id_start_date">📅 Дата и время начала</label>
                            <input type="datetime-local" name="start_date" id="id_start_date" class="form-control" required>
                        </div>
                        <div class="form-group half">
                            <label for="id_end_date">📅 Дата и время окончания</label>
                            <input type="datetime-local" name="end_date" id="id_end_date" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="id_location">📍 Место проведения</label>
                        <input type="text" name="location" id="id_location" class="form-control" placeholder="Например: Актовый зал, аудитория 101">
                    </div>

                    <div class="form-group">
                        <label for="id_description">📝 Описание события</label>
                        <textarea name="description" id="id_description" class="form-control" rows="5" placeholder="Подробное описание события..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_for_all" id="id_is_for_all" class="checkbox-input">
                            <span>👥 Для всех (без выбора групп)</span>
                        </label>
                    </div>

                    <div class="form-group" id="groupsContainer">
                        <label>🎓 Для конкретных групп</label>
                        <div class="groups-checkboxes">
                            {% for group in groups %}
                            <label class="group-checkbox">
                                <input type="checkbox" name="groups" value="{{ group.id }}" class="group-input">
                                <span>{{ group.name }} ({{ group.course.number }} курс)</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-create">🎉 Создать событие</button>
                        <a href="{% url 'events_view' %}" class="btn-cancel">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'js/event_create.js' %}"></script>
</body>
</html>
