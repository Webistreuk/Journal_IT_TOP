{% extends 'base.html' %}
{% load static %}

{% block title %}Расписание{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/schedule.css' %}">
{% endblock %}

{% block content %}
<div class="schedule-container">
    <div class="page-header">
        <h1 class="page-title">📅 Расписание</h1>
        <div class="group-info">Группа: {{ group.name }}</div>
    </div>
    
    <div id="scheduleContent"></div>
    
    <div class="go-to-today-wrapper">
        <button class="go-to-today-btn" id="goToTodayBtn" style="display: none;">📅 К текущей неделе</button>
    </div>
</div>

<button class="nav-button prev" id="prevWeekBtn">←</button>
<button class="nav-button next" id="nextWeekBtn">→</button>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/schedule.js' %}"></script>
<script>
    window.groupId = {{ group.id }};
</script>
{% endblock %}
