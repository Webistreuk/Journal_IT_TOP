<!-- templates/Authorize.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/Authorize.css' %}">
    <title>Journal</title>
</head>
<body>
    <div class="page">
        <div class="main">
            <div class="Journal">
                <p>Journal</p>
                <div class="red_line_x"></div>
                <div class="red_line_y"></div>
                <form method="post">
                    {% csrf_token %}
                    <div class="fields_of_Journal">
                        <input class="username_field" type="text" name="user" placeholder="Логин">
                        {% if error %}
                            <div class="error-message">{{ error }}</div>
                        {% endif %}
                        <input class="userpassword_field" type="password" name="password" placeholder="Пароль">
                    </div>
                    <input class="Login" type="submit" value="Вход">
                    <button class="Forgot_your_password" type="button">Забыли пароль?</button>
                    <div class="language-switcher">
                        <span>RU</span>
                        <span>EN</span>
                        <span>ES</span>
                        <span>TR</span>
                    </div>
                </form>
            </div>
            <div class="Journal_remove_password">
                <p>Journal</p>
                <div class="red_line_x_JRP"></div>
                <div class="red_line_y_JRP"></div>
                <form method="post" action="{% url 'autoriz_remove_password_view' %}">
                    {% csrf_token %}
                    <div class="fields_of_JournalRP">
                        <input class="useremail_field" type="email" name="email" placeholder="E-mail">
                    </div>
                    <input class="form_Send" type="submit" value="Отправить">
                    <button class="Return_to_the_login_page" type="button">Вернуться на страницу входа</button>
                    <div class="language-switcher">
                        <span>RU</span>
                        <span>EN</span>
                        <span>ES</span>
                        <span>TR</span>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'js/Authorize.js' %}"></script>
</body>
</html>
