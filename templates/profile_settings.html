{% extends 'base.html' %}
{% load static %}

{% block title %}Настройки профиля{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile_settings.css' %}">
{% endblock %}

{% block content %}
<div class="profile-settings-container">
    <div class="settings-card">
        <div class="settings-header">
            <a href="{% url 'chat_list_view' %}" class="back-link">← Назад к чатам</a>
            <h1>Редактирование профиля</h1>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>Аватар</label>
                {% if chat_profile.avatar %}
                <img src="{{ chat_profile.avatar.url }}" class="avatar-preview">
                {% endif %}
                <input type="file" name="avatar" class="form-control">
            </div>
            <div class="form-group">
                <label>Интересы</label>
                <textarea name="interests" class="form-control" rows="3">{{ chat_profile.interests }}</textarea>
            </div>
            <div class="form-group">
                <label>О себе</label>
                <textarea name="about" class="form-control" rows="3">{{ chat_profile.about }}</textarea>
            </div>
            <div class="form-group">
                <label>Город</label>
                <input type="text" name="city" value="{{ chat_profile.city }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Дата рождения</label>
                <input type="date" name="birth_date" value="{{ user.birth_date|date:'Y-m-d' }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Пол</label>
                <select name="gender" class="form-control">
                    <option value="">Не указано</option>
                    <option value="M" {% if user.gender == 'M' %}selected{% endif %}>Мужской</option>
                    <option value="F" {% if user.gender == 'F' %}selected{% endif %}>Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="text" name="phone" value="{{ user.phone }}" class="form-control">
            </div>
            <div class="form-group checkbox">
                <label><input type="checkbox" name="hide_phone" {% if user.hide_phone %}checked{% endif %}> Скрыть номер телефона от других пользователей</label>
            </div>
            <button type="submit" class="btn-save">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
